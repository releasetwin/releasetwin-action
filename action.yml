name: ReleaseTwin PR annotations
description: >
  Run ReleaseTwin cases and render the result onto the pull request as a comment and a
  check run. Uses only the workflow's GITHUB_TOKEN — no ReleaseTwin account or hosted call.
author: ReleaseTwin contributors
branding:
  icon: check-circle
  color: green

inputs:
  cases-path:
    description: Path (relative to the workspace) to the directory of case files to run.
    required: false
    default: cases
  image:
    description: >
      ReleaseTwin CLI container image to run. Must be a publicly pullable reference. The
      default is a pinned, immutable reference that the release workflow advances on each
      tagged release; override it with your own released version or digest. A mutable tag
      (`:latest`, a bare `:vN`) is accepted but logs a warning — see the README.
    required: false
    # Immutable pin, rewritten by .github/workflows/release.yml on each tagged release
    # (to the freshly built digest). Not managed by dependabot/renovate.
    default: ghcr.io/ernestoalejowitt22/releasetwin/cli@sha256:686a6a0f92a735008f5c99c10a35b1d74fd2143a6f541e1ab80fc2a2ecf5e186
  env-file:
    description: >
      Optional path to a file of KEY=VALUE lines passed to the CLI container (for
      ${ENV_VAR} interpolation in case files). Populate it from CI secrets in a prior step.
    required: false
    default: ""
  env-vars:
    description: >
      Optional newline-separated list of environment variable NAMES to forward from the
      job environment into the CLI container.
    required: false
    default: ""
  comment:
    description: Post/update the pull-request comment.
    required: false
    default: "true"
  check:
    description: Create the check run.
    required: false
    default: "true"
  attribution:
    description: >
      Include a footer link to the ReleaseTwin product site on the pull-request comment.
      Never affects the check run. Set to "false" to omit it.
    required: false
    default: "true"
  github-token:
    description: >
      Token used for the PR comment and check-run APIs, and for ticket write-back when
      enabled. Needs no scope beyond the default same-repo GITHUB_TOKEN permissions.
    required: false
    default: ${{ github.token }}
  evidence:
    description: >
      Capture this run's evidence on the runner and upload the single-file HTML report as a
      workflow artifact. Off by default. Evidence stays on the runner: it is written to the
      runner's temporary directory and leaves only as a workflow artifact — nothing is sent
      to a hosted service, and no ReleaseTwin account or token is involved.
    required: false
    default: "false"
  evidence-artifact-name:
    description: Name of the uploaded evidence artifact.
    required: false
    default: releasetwin-evidence
  ticket-write-back:
    description: >
      Post evidence to the GitHub Issue named by a case's oracle.locator (a bare `#123`
      resolved against this repository). Disabled by default. A locator that doesn't match
      that convention is skipped, not treated as an error.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Warn on an unpinned image
      shell: bash
      run: |
        img="${{ inputs.image }}"
        # A digest (…@sha256:…) or a specific version tag (…:1.2.3) is fine. Warn on :latest,
        # a bare major/minor tag (…:v1 / …:1.2), or a reference with no tag at all.
        if [[ "$img" == *"@sha256:"* ]] || [[ "$img" =~ :[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "Image is pinned: $img"
        else
          echo "::warning title=Unpinned ReleaseTwin CLI image::'$img' is a mutable reference. A re-tagged or compromised image would run in this job with access to any secrets you pass it. Pin a released version or digest (see the action README)."
        fi

    - name: Run ReleaseTwin
      id: run
      shell: bash
      run: |
        set -uo pipefail
        summary="${RUNNER_TEMP}/releasetwin-summary.json"

        # The documented layout is a cases directory with a sibling fixtures/ directory.
        # Mount that parent as /workspace so ${cases}/../fixtures resolves inside the container.
        cases_rel="${{ inputs.cases-path }}"
        parent="$(dirname "${GITHUB_WORKSPACE}/${cases_rel}")"
        name="$(basename "${cases_rel}")"

        args=(--rm
          -v "${parent}:/workspace:ro"
          -v "${RUNNER_TEMP}:/out")
        # local-evidence-viewer (design D8): RUNNER_TEMP is already mounted as /out and the
        # workspace is mounted read-only, so capturing evidence needs no new mount — only the two
        # environment variables. Capture writes to the runner's temp space, never the workspace.
        if [ "${{ inputs.evidence }}" = "true" ]; then
          args+=(-e RELEASETWIN_EVIDENCE=on -e RELEASETWIN_EVIDENCE_DIR=/out/releasetwin-evidence)
        fi
        if [ -n "${{ inputs.env-file }}" ]; then
          args+=(--env-file "${GITHUB_WORKSPACE}/${{ inputs.env-file }}")
        fi
        while IFS= read -r var; do
          [ -n "$var" ] && args+=(-e "$var")
        done <<< "${{ inputs.env-vars }}"

        # `shell: bash` in a composite action runs with `-e`; a case failure (exit 1) from
        # the CLI must not abort this step before the render step gets to report it.
        set +e
        docker run "${args[@]}" "${{ inputs.image }}" \
          "/workspace/${name}" --summary-json /out/releasetwin-summary.json
        code=$?
        echo "summary=${summary}" >> "$GITHUB_OUTPUT"
        echo "exit-code=${code}" >> "$GITHUB_OUTPUT"
        # Never fail this step on a case failure — the render step reports it.
        exit 0

    - name: Render onto the pull request
      # Report even if the run step itself crashed (e.g. the image could not be pulled).
      if: always()
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        # On a pull_request event GITHUB_SHA is the ephemeral merge commit — the check run
        # must land on the PR head so it shows as a PR status check.
        RELEASETWIN_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        RELEASETWIN_SUMMARY: ${{ steps.run.outputs.summary }}
        RELEASETWIN_EXIT_CODE: ${{ steps.run.outputs.exit-code }}
        RELEASETWIN_COMMENT: ${{ inputs.comment }}
        RELEASETWIN_CHECK: ${{ inputs.check }}
        RELEASETWIN_ATTRIBUTION: ${{ inputs.attribution }}
        RELEASETWIN_TICKET_WRITE_BACK: ${{ inputs.ticket-write-back }}
      run: node "${{ github.action_path }}/render.mjs"

    - name: Export the evidence report
      id: evidence
      # Best-effort throughout: this runs after the verdict is already decided, and nothing it does
      # may change that verdict, the comment, the check run, or the job's conclusion.
      if: always() && inputs.evidence == 'true'
      shell: bash
      run: |
        set +e
        export_path="${RUNNER_TEMP}/releasetwin-evidence.html"
        if [ ! -d "${RUNNER_TEMP}/releasetwin-evidence" ]; then
          echo "::notice title=ReleaseTwin evidence::The run produced no evidence directory, so there is nothing to upload."
          exit 0
        fi

        docker run --rm -v "${RUNNER_TEMP}:/out" "${{ inputs.image }}" \
          view /out/releasetwin-evidence --export /out/releasetwin-evidence.html
        if [ $? -ne 0 ] || [ ! -f "$export_path" ]; then
          echo "::warning title=ReleaseTwin evidence::Could not export the evidence report. The run's own result is unaffected."
          exit 0
        fi

        echo "file=${export_path}" >> "$GITHUB_OUTPUT"
        exit 0

    - name: Upload the evidence report
      if: always() && inputs.evidence == 'true' && steps.evidence.outputs.file != ''
      continue-on-error: true
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.evidence-artifact-name }}
        path: ${{ steps.evidence.outputs.file }}
        if-no-files-found: warn
